<title>Bonfire — rest, rate, rewatch</title>

<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#100c08; --bg2:#17100a; --surface:#1e160d; --surface2:#291d10;
    --line:rgba(255,214,168,0.09); --line2:rgba(255,214,168,0.17);
    --text:#f3ece2; --muted:#c1a888; --faint:#8a7358;
    --accent:#f5a524; --accent2:#ff7a1a; --gold:#ffce5c; --heart:#ff5d73;
    --hi:#7bc96f; --mid:#f0b429; --low:#e5484d;
    --navh:64px;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    background:
      radial-gradient(900px 520px at 50% 116%, rgba(255,122,26,0.22), transparent 62%),
      radial-gradient(680px 460px at 80% 106%, rgba(245,165,36,0.15), transparent 58%),
      radial-gradient(620px 420px at 12% -6%, rgba(226,86,43,0.09), transparent 55%),
      var(--bg);
    color:var(--text); font-family:"Inter",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom));
  }
  .app{max-width:760px; margin:0 auto; padding:0 16px;}

  /* ---------- APP BAR ---------- */
  .bar{display:flex; align-items:center; justify-content:space-between; padding:18px 2px 8px;}
  .brand{display:flex; align-items:center; gap:11px;}
  .logo{width:38px; height:38px; display:grid; place-items:center; flex:none; filter:drop-shadow(0 0 9px rgba(255,122,26,0.55));}
  .brand h1{font-family:"Oswald",sans-serif; font-weight:600; font-size:20px; letter-spacing:0.02em; text-transform:uppercase; line-height:1;}
  .brand .sub{font-family:"Space Mono",monospace; font-size:9.5px; letter-spacing:0.22em; text-transform:uppercase; color:var(--faint); margin-top:3px;}
  #installBtn{display:none; background:var(--accent); color:#fff; border:none; border-radius:9px; padding:9px 13px; font-family:"Space Mono",monospace; font-size:11px; cursor:pointer;}

  /* ---------- VIEW HEADERS ---------- */
  .vhead{padding:8px 2px 14px;}
  .vhead .eyebrow{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:0.24em; text-transform:uppercase; color:var(--accent);}
  .vhead h2{font-family:"Oswald",sans-serif; font-weight:600; font-size:30px; text-transform:uppercase; letter-spacing:0.01em; line-height:1; margin-top:5px;}
  .vhead p{color:var(--muted); font-size:13.5px; margin-top:7px; max-width:52ch;}

  /* ---------- SEARCH BOX ---------- */
  .searchbox{position:relative; margin:4px 0 16px;}
  .searchbox input{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:12px; padding:13px 14px 13px 40px; font-family:"Inter",sans-serif; font-size:15px; outline:none;
  }
  .searchbox input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(107,92,255,0.18);}
  .searchbox svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5;}

  /* ---------- FRANCHISE GRID ---------- */
  .fgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin-bottom:8px;}
  .fcard{
    background:linear-gradient(180deg,var(--surface),var(--bg2)); border:1px solid var(--line);
    border-radius:15px; padding:15px; cursor:pointer; transition:transform .16s, border-color .16s; text-align:left; min-height:112px;
    display:flex; flex-direction:column; justify-content:space-between;
  }
  .fcard:hover,.fcard:focus-visible{transform:translateY(-2px); border-color:var(--line2); outline:none;}
  .fcard .ftag{font-family:"Space Mono",monospace; font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent2);}
  .fcard .fname{font-family:"Oswald",sans-serif; font-weight:500; font-size:18px; line-height:1.08; margin-top:8px;}
  .fcard .fmeta{font-family:"Space Mono",monospace; font-size:11px; color:var(--faint); margin-top:10px; display:flex; gap:10px; align-items:center;}
  .fcard .prog{height:4px; border-radius:99px; background:var(--surface2); overflow:hidden; margin-top:9px;}
  .fcard .prog span{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%;}

  /* ---------- ORDER TOGGLE ---------- */
  .backrow{display:flex; align-items:center; gap:10px; padding:2px 2px 10px;}
  .backbtn{background:var(--surface); border:1px solid var(--line); color:var(--muted); border-radius:9px; width:34px; height:34px; display:grid; place-items:center; cursor:pointer; flex:none;}
  .backbtn:hover{color:var(--text); border-color:var(--line2);}
  .seg{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:3px; gap:2px; margin:0 0 14px;}
  .seg button{flex:1; background:none; border:none; color:var(--muted); font-family:"Space Mono",monospace; font-size:11.5px; padding:8px 6px; border-radius:8px; cursor:pointer; transition:.15s;}
  .seg button.on{background:var(--accent); color:#fff;}
  .ordernote{font-size:12px; color:var(--faint); font-style:italic; margin:-6px 2px 14px;}

  /* ---------- TITLE CARD ---------- */
  .tlist{display:flex; flex-direction:column; gap:10px;}
  .tcard{
    background:linear-gradient(180deg,var(--surface),var(--bg2)); border:1px solid var(--line);
    border-radius:14px; padding:13px 14px; display:flex; gap:12px; align-items:flex-start;
    transition:border-color .16s;
  }
  .tcard.seen{border-color:rgba(46,194,126,0.22);}
  .tcard .idx{font-family:"Space Mono",monospace; font-size:12px; color:var(--accent2); font-weight:700; padding-top:3px; min-width:22px;}
  .tbody{flex:1; min-width:0;}
  .trow1{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .ttitle{font-family:"Oswald",sans-serif; font-weight:500; font-size:17px; line-height:1.12;}
  .tyear{font-family:"Space Mono",monospace; font-size:11px; color:var(--faint);}
  .tbadge{font-family:"Space Mono",monospace; font-size:8.5px; letter-spacing:0.08em; text-transform:uppercase; padding:2px 6px; border-radius:5px; border:1px solid var(--line2); color:var(--muted);}
  .tscores{display:flex; gap:12px; margin-top:7px; font-family:"Space Mono",monospace; font-size:11.5px;}
  .tscores .imdb b{color:var(--gold);}
  .tscores .rt b{color:var(--rc,#8bc34a);}
  .tscores .mine b{color:var(--accent2);}
  .tscores .na{color:var(--faint);}

  .controls-t{display:flex; align-items:center; gap:14px; margin-top:11px; flex-wrap:wrap;}
  .stars{display:flex; gap:3px;}
  .star{cursor:pointer; color:var(--faint); transition:.12s; line-height:1;}
  .star.lit{color:var(--gold);}
  .star:hover{transform:scale(1.15);}
  .stepper{display:flex; align-items:center; gap:8px; font-family:"Space Mono",monospace; font-size:12px; color:var(--muted);}
  .stepper button{width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--surface); color:var(--text); font-size:15px; cursor:pointer; display:grid; place-items:center; line-height:1;}
  .stepper button:hover{border-color:var(--line2);}
  .stepper .cnt{min-width:52px; text-align:center;}
  .stepper .cnt b{color:var(--text);}
  .heart{background:none; border:none; cursor:pointer; color:var(--faint); padding:2px; line-height:1; transition:.14s;}
  .heart.on{color:var(--heart);}
  .heart:hover{transform:scale(1.12);}
  .movebtns{display:flex; flex-direction:column; gap:4px; margin-left:auto;}
  .movebtns button, .move{width:28px; height:24px; border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:7px; cursor:pointer; display:grid; place-items:center;}
  .move:hover{color:var(--text); border-color:var(--line2);}
  .move:disabled{opacity:.3; cursor:default;}

  .seenchip{font-family:"Space Mono",monospace; font-size:10px; color:var(--hi); border:1px solid rgba(46,194,126,0.35); border-radius:6px; padding:2px 7px;}

  /* ---------- EMPTY ---------- */
  .empty{text-align:center; padding:56px 20px; color:var(--faint);}
  .empty .big{font-family:"Oswald",sans-serif; font-size:22px; color:var(--muted); text-transform:uppercase; margin-bottom:8px;}
  .empty p{font-size:13.5px; max-width:34ch; margin:0 auto;}

  .statstrip{display:flex; gap:10px; margin:2px 0 16px;}
  .sstat{flex:1; background:linear-gradient(180deg,var(--surface),var(--bg2)); border:1px solid var(--line); border-radius:12px; padding:12px;}
  .sstat .k{font-family:"Space Mono",monospace; font-size:22px; font-weight:700;}
  .sstat .l{font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--faint); margin-top:4px;}

  /* ---------- BOTTOM NAV ---------- */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:50; height:calc(var(--navh) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(12,15,30,0.86); backdrop-filter:blur(14px); border-top:1px solid var(--line);
    display:flex; justify-content:center; gap:6px;
  }
  nav.tabbar .tab{
    flex:1; max-width:150px; background:none; border:none; color:var(--faint); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-family:"Space Mono",monospace; font-size:10px; letter-spacing:0.08em; text-transform:uppercase; transition:.15s;
  }
  nav.tabbar .tab.on{color:var(--text);}
  nav.tabbar .tab.on svg{stroke:var(--accent2);}
  nav.tabbar .tab svg{stroke:var(--faint); transition:.15s;}

  .hidden{display:none!important;}
  .fade{animation:fu .35s ease both;}
  @keyframes fu{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important;}}
  @media (max-width:420px){ .fgrid{grid-template-columns:1fr;} .vhead h2{font-size:26px;} }
</style>
</head>

   {t:"The Hunger Games",y:2012,imdb:7.2,rt:84,so:2},
   {t:"Catching Fire",y:2013,imdb:7.5,rt:90,so:3},
   {t:"Mockingjay – Part 1",y:2014,imdb:6.6,rt:65,so:4},
   {t:"Mockingjay – Part 2",y:2015,imdb:6.5,rt:70,so:5}
  ]},
 {id:"mi", name:"Mission: Impossible", tag:"Spy action", storyLabel:null,
  items:[
   {t:"Mission: Impossible",y:1996,imdb:7.2,rt:66,so:1},
   {t:"Mission: Impossible 2",y:2000,imdb:6.1,rt:57,so:2},
   {t:"Mission: Impossible III",y:2006,imdb:6.9,rt:71,so:3},
   {t:"Ghost Protocol",y:2011,imdb:7.4,rt:93,so:4},
   {t:"Rogue Nation",y:2015,imdb:7.4,rt:94,so:5},
   {t:"Fallout",y:2018,imdb:7.7,rt:97,so:6},
   {t:"Dead Reckoning Part One",y:2023,imdb:7.7,rt:96,so:7}
  ]},
 {id:"jw", name:"John Wick", tag:"Action", storyLabel:null,
  items:[
   {t:"John Wick",y:2014,imdb:7.4,rt:86,so:1},
   {t:"John Wick: Chapter 2",y:2017,imdb:7.4,rt:89,so:2},
   {t:"John Wick: Chapter 3 – Parabellum",y:2019,imdb:7.4,rt:89,so:3},
   {t:"John Wick: Chapter 4",y:2023,imdb:7.7,rt:94,so:4}
  ]},
 {id:"jp", name:"Jurassic Park / World", tag:"Sci-fi", storyLabel:null,
  items:[
   {t:"Jurassic Park",y:1993,imdb:8.2,rt:92,so:1},
   {t:"The Lost World: Jurassic Park",y:1997,imdb:6.5,rt:53,so:2},
   {t:"Jurassic Park III",y:2001,imdb:5.9,rt:50,so:3},
   {t:"Jurassic World",y:2015,imdb:6.9,rt:71,so:4},
   {t:"Jurassic World: Fallen Kingdom",y:2018,imdb:6.1,rt:47,so:5},
   {t:"Jurassic World Dominion",y:2022,imdb:5.6,rt:29,so:6}
  ]}
];

/* assign stable ids + release order index */
FR.forEach(f=>{
  f.items.forEach((it,i)=>{ it.id = f.id+"-"+i; it.ro = i+1; it.fr = f.id; it.frName = f.name; });
});
const ALL = FR.flatMap(f=>f.items);
const byId = Object.fromEntries(ALL.map(it=>[it.id,it]));

/* ================= USER STATE (localStorage, degrades to memory) ================= */
const UKEY="bonfire:user:v1", CKEY="bonfire:custom:v1";
let USER = {};      // id -> {seen,rating,fav}
let CUSTOM = {};    // frId -> [ids]
function load(){
  try{ const u=localStorage.getItem(UKEY); if(u) USER=JSON.parse(u); }catch(e){}
  try{ const c=localStorage.getItem(CKEY); if(c) CUSTOM=JSON.parse(c); }catch(e){}
}
function saveUser(){ try{ localStorage.setItem(UKEY,JSON.stringify(USER)); }catch(e){} }
function saveCustom(){ try{ localStorage.setItem(CKEY,JSON.stringify(CUSTOM)); }catch(e){} }
function u(id){ return USER[id] || (USER[id]={seen:0,rating:0,fav:false}); }

/* ================= HELPERS ================= */
function rtColor(v){ if(v==null) return "#8bc34a"; if(v>=75) return "#2ec27e"; if(v>=60) return "#8bc34a"; if(v>=50) return "#f0b429"; return "#e5484d"; }
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&quot;');

/* ================= RENDER: TITLE CARD ================= */
function titleCard(it, idx, opts={}){
  const s=u(it.id);
  const stars=[1,2,3,4,5].map(n=>`<span class="star ${s.rating>=n?'lit':''}" data-rate="${it.id}" data-n="${n}" role="button" aria-label="${n} star">★</span>`).join("");
  const rt = it.rt==null?`<span class="na">RT —</span>`:`<span class="rt" style="--rc:${rtColor(it.rt)}">RT <b>${it.rt}%</b></span>`;
  const imdb = it.imdb==null?`<span class="na">IMDb —</span>`:`<span class="imdb">IMDb <b>${it.imdb.toFixed(1)}</b></span>`;
  const mine = s.rating?`<span class="mine">You <b>${s.rating}/5</b></span>`:``;
  const rw = s.seen>1?` · ${s.seen-1}× rewatch`:``;
  const badge = it.type&&it.type!=="Film"?`<span class="tbadge">${it.type}</span>`:``;
  const showFr = opts.showFranchise?`<span class="tbadge">${esc(it.frName.split(" ").slice(0,2).join(" "))}</span>`:``;
  const moveCol = opts.reorder?`
    <div class="movebtns">
      <button class="move" data-move="up" data-id="${it.id}" ${idx===0?'disabled':''} aria-label="Move up">▲</button>
      <button class="move" data-move="down" data-id="${it.id}" ${opts.last?'disabled':''} aria-label="Move down">▼</button>
    </div>`:``;
  return `
  <div class="tcard ${s.seen>0?'seen':''} fade">
    ${idx!=null?`<div class="idx">${String(idx+1).padStart(2,'0')}</div>`:``}
    <div class="tbody">
      <div class="trow1">
        <span class="ttitle">${esc(it.t)}</span>
        <span class="tyear">${it.y}</span>
        ${badge}${showFr}
        ${s.seen>0?`<span class="seenchip">seen ${s.seen}×</span>`:``}
      </div>
      <div class="tscores">${imdb} ${rt} ${mine}</div>
      <div class="controls-t">
        <div class="stars" title="Your rating">${stars}</div>
        <div class="stepper">
          <button data-seen="dec" data-id="${it.id}" aria-label="Watched one less">–</button>
          <span class="cnt"><b>${s.seen}</b> watched${rw}</span>
          <button data-seen="inc" data-id="${it.id}" aria-label="Watched one more">+</button>
        </div>
        <button class="heart ${s.fav?'on':''}" data-fav="${it.id}" aria-label="Favourite">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="${s.fav?'currentColor':'none'}" stroke="currentColor" stroke-width="1.7"><path d="M12 20s-7-4.5-9.5-9C1 8 2.5 5 6 5c2 0 3.2 1.2 4 2.3C10.8 6.2 12 5 14 5c3.5 0 5 3 3.5 6-2.5 4.5-9.5 9-9.5 9z"/></svg>
        </button>
      </div>
    </div>
    ${moveCol}
  </div>`;
}

/* ================= VIEWS ================= */
let state={ tab:"browse", fr:null, order:"release", q:"" };
const view=document.getElementById("view");

function renderBrowse(){
  const cards=FR.map(f=>{
    const total=f.items.length;
    const seen=f.items.filter(it=>u(it.id).seen>0).length;
    const pct=Math.round(seen/total*100);
    return `<button class="fcard" data-fr="${f.id}">
      <div><div class="ftag">${f.tag}</div><div class="fname">${esc(f.name)}</div></div>
      <div>
        <div class="prog"><span style="width:${pct}%"></span></div>
        <div class="fmeta"><span>${total} titles</span><span>${seen}/${total} seen</span></div>
      </div>
    </button>`;
  }).join("");
  view.innerHTML=`
    <div class="vhead"><div class="eyebrow">Your library</div><h2>Browse franchises</h2>
    <p>Pick a saga, choose the order you want to watch it in, then rate and track as you go.</p></div>
    <div class="fgrid">${cards}</div>`;
}

function renderFranchise(){
  const f=FR.find(x=>x.id===state.fr);
  let items;
  if(state.order==="custom"){
    const saved=CUSTOM[f.id];
    const base = saved && saved.length===f.items.length ? saved.map(id=>byId[id]).filter(Boolean) : [...f.items];
    items = base;
  } else if(state.order==="story"){
    items=[...f.items].sort((a,b)=>a.so-b.so);
  } else {
    items=[...f.items].sort((a,b)=>a.ro-b.ro);
  }
  const hasStory = !!f.storyLabel;
  const seg=`<div class="seg">
     <button data-order="release" class="${state.order==='release'?'on':''}">Release</button>
     ${hasStory?`<button data-order="story" class="${state.order==='story'?'on':''}">${f.storyLabel}</button>`:``}
     <button data-order="custom" class="${state.order==='custom'?'on':''}">Custom</button>
   </div>`;
  const note = state.order==="custom"
     ? `Reorder with the arrows — your order is saved on this device.`
     : (state.order==="story" && f.id==="ff") ? `The famous one: Tokyo Drift slots in near the end, not third.`
     : (state.order==="story") ? `In-universe order — differs from how they released.`
     : `The order they hit cinemas.`;
  const last=items.length-1;
  const list=items.map((it,i)=>titleCard(it,i,{reorder:state.order==="custom", last:i===last})).join("");
  view.innerHTML=`
    <div class="backrow">
      <button class="backbtn" id="back" aria-label="Back">←</button>
      <div><div class="eyebrow" style="font-family:'Space Mono';font-size:10px;letter-spacing:.2em;color:var(--faint)">${f.tag}</div>
      <div style="font-family:'Oswald';font-size:22px;text-transform:uppercase;line-height:1;margin-top:2px">${esc(f.name)}</div></div>
    </div>
    ${seg}<div class="ordernote">${note}</div>
    <div class="tlist">${list}</div>`;
}

function renderSearch(){
  const q=state.q.trim().toLowerCase();
  let results = q ? ALL.filter(it=>it.t.toLowerCase().includes(q)||it.frName.toLowerCase().includes(q)) : [];
  results.sort((a,b)=>b.y-a.y);
  const body = !q
    ? `<div class="empty"><div class="big">Search everything</div><p>Find any title across all ${FR.length} franchises — then rate it, favourite it, or count a rewatch.</p></div>`
    : results.length
      ? `<div class="tlist">${results.slice(0,60).map(it=>titleCard(it,null,{showFranchise:true})).join("")}</div>`
      : `<div class="empty"><div class="big">Nothing found</div><p>No bundled title matches “${esc(state.q)}”. More franchises can be added anytime.</p></div>`;
  view.innerHTML=`
    <div class="vhead"><div class="eyebrow">Find a title</div><h2>Search</h2></div>
    <div class="searchbox">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9298c0" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
      <input id="searchInput" type="text" placeholder="e.g. Empire, Wick, Azkaban…" value="${esc(state.q)}" autocomplete="off">
    </div>${body}`;
  const inp=document.getElementById("searchInput");
  inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
}

function renderFavs(){
  const favs=ALL.filter(it=>u(it.id).fav);
  const seenCount=ALL.filter(it=>u(it.id).seen>0).length;
  const rewatch=ALL.reduce((n,it)=>n+Math.max(0,u(it.id).seen-1),0);
  const rated=ALL.filter(it=>u(it.id).rating>0).length;
  favs.sort((a,b)=>u(b.id).rating-u(a.id).rating || b.y-a.y);
  const strip=`<div class="statstrip">
     <div class="sstat"><div class="k">${seenCount}</div><div class="l">Titles seen</div></div>
     <div class="sstat"><div class="k" style="color:var(--accent2)">${rewatch}</div><div class="l">Rewatches</div></div>
     <div class="sstat"><div class="k" style="color:var(--gold)">${rated}</div><div class="l">You rated</div></div>
   </div>`;
  const body = favs.length
    ? `<div class="tlist">${favs.map(it=>titleCard(it,null,{showFranchise:true})).join("")}</div>`
    : `<div class="empty"><div class="big">No favourites yet</div><p>Tap the heart on any title and it lands here, with your score and rewatch count.</p></div>`;
  view.innerHTML=`
    <div class="vhead"><div class="eyebrow">Your shelf</div><h2>Favourites</h2></div>
    ${strip}${body}`;
}

function render(){
  if(state.tab==="browse"){ state.fr?renderFranchise():renderBrowse(); }
  else if(state.tab==="search"){ renderSearch(); }
  else renderFavs();
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===state.tab));
}

/* ================= EVENTS (delegated) ================= */
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  state.tab=t.dataset.tab; if(state.tab!=="browse") state.fr=null; render();
}));

view.addEventListener("input",e=>{
  if(e.target.id==="searchInput"){ state.q=e.target.value; renderSearch(); }
});

view.addEventListener("click",e=>{
  const t=e.target;
  const fr=t.closest("[data-fr]");
  if(fr){ state.fr=fr.dataset.fr; state.order="release"; render(); return; }
  if(t.id==="back"){ state.fr=null; render(); return; }
  const ord=t.closest("[data-order]");
  if(ord){
    state.order=ord.dataset.order;
    if(state.order==="custom" && !CUSTOM[state.fr]){
      const f=FR.find(x=>x.id===state.fr);
      CUSTOM[state.fr]=[...f.items].sort((a,b)=>a.ro-b.ro).map(i=>i.id); saveCustom();
    }
    render(); return;
  }
  const star=t.closest("[data-rate]");
  if(star){ const s=u(star.dataset.rate); const n=+star.dataset.n; s.rating = s.rating===n?0:n; saveUser(); render(); return; }
  const seen=t.closest("[data-seen]");
  if(seen){ const s=u(seen.dataset.id); s.seen=Math.max(0,s.seen+(seen.dataset.seen==="inc"?1:-1)); saveUser(); render(); return; }
  const fav=t.closest("[data-fav]");
  if(fav){ const s=u(fav.dataset.fav); s.fav=!s.fav; saveUser(); render(); return; }
  const mv=t.closest("[data-move]");
  if(mv){ moveCustom(mv.dataset.id, mv.dataset.move); return; }
});

function moveCustom(id,dir){
  const arr=CUSTOM[state.fr]; const i=arr.indexOf(id);
  const j=dir==="up"?i-1:i+1;
  if(j<0||j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]]; saveCustom(); render();
}

/* ================= PWA ================= */
let deferred;
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; document.getElementById("installBtn").style.display="block"; });
document.getElementById("installBtn").addEventListener("click",async()=>{
  if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred=null;
  document.getElementById("installBtn").style.display="none";
});
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

/* ================= INIT ================= */
load(); render();
</script>
</body>
</html>
